<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <meta name="theme-color" content="#2d6a4f" />
    <meta name="description" content="GranjaApp — Sistema de Gestão de Suinocultura. Controle de lotes, alimentação, sanidade, reprodução e relatórios financeiros." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="GranjaApp" />
    <!-- Open Graph -->
    <meta property="og:title" content="GranjaApp — Gestão de Suinocultura" />
    <meta property="og:description" content="Sistema completo de gestão para granjas suínas." />
    <meta property="og:type" content="website" />
    <title>GranjaApp — Gestão de Suinocultura</title>
    <style>
      /* Splash screen antes do React montar */
      #splash {
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center;
        flex-direction: column; gap: 16px;
        background: #f8f9fa; z-index: 9999;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      #splash .sp-icon { font-size: 56px; animation: sp-bounce .8s ease infinite alternate; }
      #splash .sp-title { font-size: 20px; font-weight: 700; color: #2d6a4f; }
      #splash .sp-sub { font-size: 13px; color: #6c757d; }
      @keyframes sp-bounce { from { transform: translateY(0); } to { transform: translateY(-8px); } }
    </style>
  </head>
  <body>
    <div id="splash">
      <div class="sp-icon">🐖</div>
      <div class="sp-title">GranjaApp</div>
      <div class="sp-sub">Carregando...</div>
    </div>
    <div id="root"></div>
    <script>
      // Remove splash assim que o React montar
      window.__removeSplash = function() {
        const s = document.getElementById('splash')
        if (s) { s.style.opacity = '0'; s.style.transition = 'opacity .3s'; setTimeout(() => s.remove(), 300) }
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
